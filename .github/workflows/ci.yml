name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  type-check:
    name: Conformance suite types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: conformance/package-lock.json
      - run: npm ci
        working-directory: conformance
      - run: npm run type-check
        working-directory: conformance

  # Every supported Ubuntu on amd64 and arm64. Ubuntu 22.04 has the oldest supported Boost (1.74),
  # GCC 11 and nlohmann/json 3.10.
  libmiti:
    name: libmiti (Ubuntu ${{ matrix.ubuntu }}, ${{ matrix.arch }}${{ matrix.check == 'sanitizers' && ', sanitizers' || '' }})
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
        arch: [amd64, arm64]
        check: [tests]
        include:
          - ubuntu: '24.04'
            arch: amd64
            check: sanitizers
    runs-on: ubuntu-${{ matrix.ubuntu }}${{ matrix.arch == 'arm64' && '-arm' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: conformance/package-lock.json
      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config \
            libboost-dev nlohmann-json3-dev libgtest-dev libturbojpeg0-dev
      - name: Build
        run: |
          flags="-Werror"
          if [ "${{ matrix.check }}" = sanitizers ]; then
            flags="$flags -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          fi
          cmake -S core -B core/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="$flags"
          cmake --build core/build
      - name: Tests
        run: ctest --test-dir core/build --output-on-failure
      - run: npm ci
        working-directory: conformance
      - name: Conformance against libmiti's example server
        run: bash conformance/run.sh libmiti core/build/examples/conformance_server

  # Windows: MSVC with conda-forge's Boost, nlohmann_json and TurboJPEG, from the pixi environment.
  # CMAKE_COMPILE_WARNING_AS_ERROR is /WX, MSVC's -Werror. Git Bash runs the conformance suite.
  libmiti-windows:
    name: libmiti (Windows, MSVC)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.62.2
          environments: core
          locked: true
      - name: Build
        run: |
          pixi run -e core cmake -S core -B core/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          pixi run -e core cmake --build core/build
      - name: Tests
        run: pixi run -e core ctest --test-dir core/build --output-on-failure
      # A shared libmiti exports its symbols as it does with GCC and Clang.
      - name: Shared library
        run: |
          pixi run -e core cmake -S core -B core/build-shared -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DBUILD_SHARED_LIBS=ON -DMITI_BUILD_TESTS=OFF
          pixi run -e core cmake --build core/build-shared
      - run: pixi run -e core install
      - name: Conformance against libmiti's example server
        run: pixi run -e core bash conformance/run.sh libmiti core/build/examples/conformance_server

  # The container sets the Ubuntu: Humble runs on 22.04 and Jazzy on 24.04, each on amd64 and arm64.
  ros:
    name: ${{ matrix.distro }} (Ubuntu ${{ matrix.distro == 'humble' && '22.04' || '24.04' }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ros:${{ matrix.distro }}-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install build tools, libraries and the reference bridge
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ninja-build pkg-config \
            libboost-dev nlohmann-json3-dev libgtest-dev libturbojpeg0-dev \
            ros-${{ matrix.distro }}-ament-cmake-gtest \
            ros-${{ matrix.distro }}-foxglove-bridge ros-${{ matrix.distro }}-std-srvs \
            ros-${{ matrix.distro }}-sensor-msgs ros-${{ matrix.distro }}-tf2-msgs
      - run: npm ci
        working-directory: conformance
      - name: Build libmiti and miti_bridge
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --merge-install --base-paths core ros \
            --cmake-args -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS=-Werror
      - name: Tests
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon test --merge-install --base-paths core ros --event-handlers console_direct+
          colcon test-result --verbose
      - name: Conformance against miti_bridge
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          bash conformance/run.sh miti-bridge install/lib/miti_bridge/miti_bridge
      # The reference for the base protocol: the suite must pass against the reference bridge.
      - name: Conformance against the reference bridge
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          bash conformance/run.sh reference
      - name: Generic service client prototype
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          bash prototypes/generic_service_client/run.sh

  # Jazzy on RHEL 9 (x86_64), which the ROS buildfarm also releases for. rosdep installs the
  # dependencies, as the buildfarm resolves them. Humble's RHEL 8 has Boost 1.66, older than
  # libmiti needs, so the buildfarm skips libmiti and miti_bridge there.
  ros-rhel:
    name: jazzy (RHEL 9)
    runs-on: ubuntu-24.04
    container: almalinux:9
    defaults:
      run:
        shell: bash
    steps:
      - name: Install ROS 2 Jazzy, rosdep and colcon
        run: |
          dnf install -y epel-release 'dnf-command(config-manager)'
          dnf config-manager --set-enabled crb
          curl -fsSL --output /etc/yum.repos.d/ros2.repo http://packages.ros.org/ros2/rhel/ros2.repo
          dnf install -y git ros-jazzy-ros-base python3-rosdep python3-colcon-common-extensions
      - uses: actions/checkout@v7
      - name: Install the dependencies with rosdep
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep init
          rosdep update --rosdistro jazzy
          rosdep install --from-paths core ros --ignore-src -y --rosdistro jazzy
      - name: Build libmiti and miti_bridge
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --merge-install --base-paths core ros \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS=-Werror
      - name: Tests
        run: |
          source /opt/ros/jazzy/setup.bash
          export ROS_DOMAIN_ID=$((100 + RANDOM % 100)) ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
          colcon test --merge-install --base-paths core ros --event-handlers console_direct+
          colcon test-result --verbose

  # RoboStack's Humble and Jazzy on Windows, built with MSVC like libmiti above. colcon prints each
  # package's whole output (console_cohesion+), since MSVC writes its errors to stdout. The
  # reference bridge's conformance run stays on Linux.
  ros-windows:
    name: ${{ matrix.distro }} (Windows, RoboStack)
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.62.2
          environments: ${{ matrix.distro }}
          locked: true
      - name: Build libmiti and miti_bridge
        run: |
          pixi run -e $DISTRO colcon --log-base log/$DISTRO build --merge-install --base-paths core ros \
            --build-base build/$DISTRO --install-base install/$DISTRO \
            --event-handlers console_cohesion+ \
            --cmake-args -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Tests
        run: |
          pixi run -e $DISTRO colcon --log-base log/$DISTRO test --merge-install --base-paths core ros \
            --build-base build/$DISTRO --install-base install/$DISTRO --event-handlers console_direct+
          pixi run -e $DISTRO colcon test-result --test-result-base build/$DISTRO --verbose
      # As the README runs it on Windows, short of starting it.
      - name: Launch file
        shell: pwsh
        run: >-
          pixi run -e $env:DISTRO pwsh -NoProfile -Command
          ". ./install/$env:DISTRO/local_setup.ps1; ros2 launch miti_bridge miti_start --show-args"
      - run: pixi run -e $DISTRO install
      - name: Conformance against miti_bridge
        run: pixi run -e $DISTRO bash conformance/run.sh miti-bridge install/$DISTRO/lib/miti_bridge/miti_bridge
