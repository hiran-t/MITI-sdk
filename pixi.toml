# Development environments for the MITI SDK, without a system ROS install:
#   pixi run -e humble conformance-foxglove   the conformance suite against foxglove_bridge
#   pixi run -e jazzy conformance-foxglove    the same on Jazzy
#   pixi run -e humble service-prototype      build and try the generic service client prototype
#   pixi run -e core test                     build libmiti and run its tests (no ROS needed)
#   pixi run -e core conformance-libmiti      the conformance suite against libmiti's example server
#   pixi run type-check                       type-check the conformance suite

[workspace]
name = "miti-sdk"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
nodejs = "22.*"

[tasks]
install = { cmd = "npm ci --no-audit --no-fund", cwd = "conformance", inputs = ["conformance/package.json", "conformance/package-lock.json"], outputs = ["conformance/node_modules/.package-lock.json"] }
type-check = { cmd = "npx tsc --noEmit", cwd = "conformance", depends-on = ["install"], description = "Type-check the conformance suite" }

# C++: libmiti and what it needs. libmiti has no ROS dependency.
[feature.cpp.system-requirements]
macos = "14.0"

[feature.cpp.dependencies]
cmake = "<4"
cxx-compiler = "*"
ninja = "*"
libboost-devel = "*"
nlohmann_json = "*"
gtest = "*"

[feature.cpp.tasks]
configure = { cmd = "cmake -S core -B core/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=$CONDA_PREFIX", inputs = ["core/CMakeLists.txt"], outputs = ["core/build/build.ninja"] }
build = { cmd = "cmake --build core/build", depends-on = ["configure"], description = "Build libmiti, its tests and examples" }
test = { cmd = "ctest --test-dir core/build --output-on-failure", depends-on = ["build"], description = "Run libmiti's tests" }
conformance-libmiti = { cmd = "bash conformance/run.sh libmiti core/build/examples/conformance_server", depends-on = ["build", "install"], description = "Run the conformance suite against libmiti's example server" }

# ROS 2 for the fixture graph (rclpy), the reference server (foxglove_bridge) and miti_bridge.
[feature.ros.dependencies]
colcon-common-extensions = "*"

[feature.ros.tasks]
# libmiti and miti_bridge, built together by colcon into build/<distro> and install/<distro>.
build-bridge = { cmd = "colcon --log-base log/$ROS_DISTRO build --merge-install --base-paths core ros --build-base build/$ROS_DISTRO --install-base install/$ROS_DISTRO --cmake-args -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo", description = "Build libmiti and miti_bridge with colcon" }
test-bridge = { cmd = "colcon --log-base log/$ROS_DISTRO test --merge-install --base-paths core ros --build-base build/$ROS_DISTRO --install-base install/$ROS_DISTRO --event-handlers console_direct+ && colcon --log-base log/$ROS_DISTRO test-result --test-result-base build/$ROS_DISTRO", depends-on = ["build-bridge"], description = "Run the tests of libmiti and miti_bridge" }
conformance-bridge = { cmd = "bash conformance/run.sh miti-bridge install/$ROS_DISTRO/lib/miti_bridge/miti_bridge", depends-on = ["build-bridge", "install"], description = "Run the conformance suite against miti_bridge and the fixture graph" }
conformance-foxglove = { cmd = "bash conformance/run.sh foxglove", depends-on = ["install"], description = "Run the conformance suite against foxglove_bridge and the fixture graph" }
fixture = { cmd = "bash conformance/fixture/run-fixture.sh", description = "Start the fixture graph on its own" }
service-prototype = { cmd = "bash prototypes/generic_service_client/run.sh", description = "Build the generic service client prototype and call the fixture's service" }

[feature.humble]
channels = [{ channel = "robostack-humble", priority = 1 }]

[feature.humble.dependencies]
ros-humble-rclpy = "*"
ros-humble-rclcpp = "*"
ros-humble-rcpputils = "*"
ros-humble-rosidl-typesupport-introspection-cpp = "*"
ros-humble-rmw-fastrtps-cpp = "*"
ros-humble-std-msgs = "*"
ros-humble-std-srvs = "*"
ros-humble-sensor-msgs = "*"
ros-humble-tf2-msgs = "*"
ros-humble-rosgraph-msgs = "*"
ros-humble-foxglove-bridge = ">=3.6,<4"
ros-humble-ros2topic = "*"
ros-humble-ros2service = "*"
ros-humble-ament-cmake = "*"
ros-humble-ament-cmake-gtest = "*"
ros-humble-ament-index-cpp = "*"
ros-humble-ros2launch = "*"
ros-humble-launch-ros = "*"

[feature.jazzy]
channels = [{ channel = "robostack-jazzy", priority = 1 }]

[feature.jazzy.dependencies]
ros-jazzy-rclpy = "*"
ros-jazzy-rclcpp = "*"
ros-jazzy-rcpputils = "*"
ros-jazzy-rosidl-typesupport-introspection-cpp = "*"
ros-jazzy-rmw-fastrtps-cpp = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-std-srvs = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-tf2-msgs = "*"
ros-jazzy-rosgraph-msgs = "*"
ros-jazzy-foxglove-bridge = ">=3.6,<4"
ros-jazzy-ros2topic = "*"
ros-jazzy-ros2service = "*"
ros-jazzy-ament-cmake = "*"
ros-jazzy-ament-cmake-gtest = "*"
ros-jazzy-ament-index-cpp = "*"
ros-jazzy-ros2launch = "*"
ros-jazzy-launch-ros = "*"

[environments]
core = ["cpp"]
humble = ["humble", "ros", "cpp"]
jazzy = ["jazzy", "ros", "cpp"]
